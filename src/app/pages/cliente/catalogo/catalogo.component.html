<!-- ✅ LOADING STATE -->
<div *ngIf="loading" class="loading-container">
  <div class="loading-spinner"></div>
  <p>Cargando productos...</p>
</div>

<!-- ✅ ERROR STATE -->
<div *ngIf="error && !loading" class="error-container">
  <div class="error-message">
    <h3>😕 Ocurrió un error</h3>
    <p>{{ error }}</p>
    <button (click)="recargarProductos()" class="btn-retry">Reintentar</button>
  </div>
</div>

<!-- ✅ CONTENIDO PRINCIPAL -->
<div *ngIf="!loading && !error">

  <!-- 🔹 BANNER PRINCIPAL CON PARTÍCULAS -->
  <section class="banner">
    <div class="banner-content">
      <h2>
        <span class="reveal-text">
          ¡ Bienvenido a TodoTechShop Tecnología Sin Límites !
        </span>
        <span class="reveal-text">
          Descubre innovación, calidad y asesoría experta en cada compra
        </span>
      </h2>
    </div>
  </section>

  


  <!-- 🔹 CARRUSELES DE PRODUCTOS PÚBLICOS -->
  

  <app-carrusel-publico
    *ngIf="productosIphone.length > 0"
    [productos]="productosIphone"
    titulo="iPhone"
    carouselId="iphone">
  </app-carrusel-publico>

 <section class="feature-section-wrapper">
<app-feature-banner
    imageUrl="assets/feature1.png"
    title="Tienda TodoTech Shop"
    subtitle="Explora nuestro catálogo exclusivo de productos tecnológicos. Encuentra las últimas novedades en smartphones, laptops, accesorios y más, todo en un solo lugar."
    primaryText="Ver Productos"
    [reverse]="false"
    backgroundColor="linear-gradient(135deg, #191919 0%, #000000 100%)"
    textColor="#E1E1E1">
</app-feature-banner>

<app-feature-banner
  imageUrl="assets/jbl.png"
  title="Tecnología para cada día"
  subtitle="Descubre dispositivos pensados para acompañarte en tu rutina: desde smartphones potentes y laptops ultraligeras hasta accesorios que hacen tu experiencia más cómoda y productiva."
  primaryText="Explorar ahora"
  [reverse]="true"
  backgroundColor="linear-gradient(135deg, #ffffff 0%, #f5f5f7 100%)"
  textColor="#111827">
</app-feature-banner>


  
  <app-feature-banner
    imageUrl="assets/iphone-banner.png"
    title="iPhone 17 Pro Max"
    subtitle="Nuevo acabado naranja que destaca a primera vista, cámaras Pro capaces de capturar cada detalle incluso de noche y un rendimiento pensado para acompañarte todo el día."
    primaryText="Más información"
    [reverse]="false"
    backgroundColor="linear-gradient(135deg, #fff5e6 0%, #ffe0b3 100%)"
    textColor="#1f2933">
  </app-feature-banner>

  <app-feature-banner
    imageUrl="assets/iphone-banner2.png"
    title="Diseñado para brillar"
    subtitle="Pantalla ProMotion fluida, chip de próxima generación optimizado para juegos y creatividad, y un diseño naranja que convierte cada vistazo en una experiencia única."
    primaryText="Ver catálogo"
    [reverse]="true"
    backgroundColor="linear-gradient(135deg, #191919 0%, #000000 100%)"
    textColor="#E1E1E1">
  </app-feature-banner>
</section>



<app-carrusel-publico
    *ngIf="productosGaming.length > 0"
    [productos]="productosGaming"
    titulo="Gaming"
    carouselId="gaming">
  </app-carrusel-publico>

  
  <app-carrusel-publico
    *ngIf="productosAsus.length > 0"
    [productos]="productosAsus"
    titulo="Laptops Asus"
    carouselId="asus">
  </app-carrusel-publico>

  

</div>
