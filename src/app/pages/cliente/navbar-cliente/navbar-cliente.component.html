<nav class="navbar" [class.scrolled]="scrolled">
  <div class="nav-container">
    <!-- Logo -->
    <div class="nav-logo">
      <img src="assets/logoDark.png" alt="TodoTech Shop" class="logo-img">
    </div>

   

<button class="hamburger-btn" (click)="toggleMenu()" aria-label="Menú" 
        [class.active]="menuAbierto">
  <span class="hamburger-icon">
    <i class="fas fa-bars"></i>
  </span>
</button>

    <!-- Overlay para fondo oscuro -->
    <div class="menu-overlay" (click)="closeMenu()" [class.active]="menuAbierto"></div>

    <!-- Menú de navegación -->
    <ul class="nav-menu" [class.active]="menuAbierto">
      <li class="nav-item">
        <button class="nav-link" 
                (click)="irACatalogo(); closeMenu()"
                [class.active]="seccionActiva === 'catalogo'">
          <i class="fas fa-store"></i>
          <span>Catálogo</span>
        </button>
      </li>
      
      <li class="nav-item">
        <button class="nav-link" 
                (click)="irAInicio(); closeMenu()"
                [class.active]="seccionActiva === 'inicio'">
          <i class="fas fa-home"></i>
          <span>Inicio</span>
        </button>
      </li>
      
      <li class="nav-item">
        <button class="nav-link" 
                (click)="irALaptops(); closeMenu()"
                [class.active]="seccionActiva === 'laptops'">
          <i class="fas fa-laptop"></i>
          <span>Laptops & PCs</span>
        </button>
      </li>
      
      <li class="nav-item">
        <button class="nav-link" 
                (click)="irAPhone(); closeMenu()"
                [class.active]="seccionActiva === 'phone'">
          <i class="fas fa-mobile-alt"></i>
          <span>Smartphones</span>
        </button>
      </li>
      
      <li class="nav-item">
        <button class="nav-link" 
                (click)="irAGaming(); closeMenu()"
                [class.active]="seccionActiva === 'gaming'">
          <i class="fas fa-gamepad"></i>
          <span>Gaming</span>
        </button>
      </li>
      
      <li class="nav-item">
        <button class="nav-link" 
                (click)="irAAccesorios(); closeMenu()"
                [class.active]="seccionActiva === 'accesorios'">
          <i class="fas fa-headphones"></i>
          <span>Accesorios</span>
        </button>
      </li>
    </ul>

    <!-- Menú de usuario -->
    <div class="nav-user">
      <div class="user-actions">
        <!-- Botón de búsqueda -->
        <button class="action-btn" 
                (click)="irABuscar(); closeMenu()" 
                title="Buscar productos">
          <i class="fas fa-search"></i>
        </button>
      </div>
      <button class="logout-btn" (click)="salir()" title="Cerrar sesión">
        <i class="fas fa-sign-out-alt"></i>
        <span>Salir</span>
      </button>
    </div>
  </div>
</nav>
